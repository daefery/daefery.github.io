name: Deploy FYP to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'fyp/**'
      - '.github/workflows/deploy-fyp.yml'
  pull_request:
    branches: [master]
    paths:
      - 'fyp/**'
      - '.github/workflows/deploy-fyp.yml'
  workflow_dispatch:

concurrency:
  group: fyp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fyp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fyp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Install browser for regression checks
        run: npx playwright install --with-deps chromium

      - name: Verify exported pages, SEO, assets and mobile layouts
        run: npm test

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: fyp/out
          publish_branch: gh-pages
